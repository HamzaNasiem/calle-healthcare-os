name: 24/7 Render Backend Keep-Alive Ping

on:
  schedule:
    # Run every 10 minutes 24/7 (Render free tier sleeps after 15 min of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: render-keep-alive
  cancel-in-progress: true

jobs:
  keep-alive:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send HTTP Ping to Render
        run: |
          TARGET_URL="https://calle-healthcare-os.onrender.com/health"
          echo "Sending keep-alive ping to $TARGET_URL at $(date -u)..."
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$TARGET_URL" || echo "000")
          echo "Initial response status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "SUCCESS: Render backend is awake, healthy, and responsive!"
            exit 0
          fi
          
          echo "Retrying ping in 10 seconds..."
          sleep 10
          RETRY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 35 "$TARGET_URL" || echo "000")
          echo "Retry response status: $RETRY_STATUS"
          
          if [ "$RETRY_STATUS" -eq 200 ]; then
            echo "SUCCESS: Render backend woke up successfully!"
            exit 0
          else
            echo "NOTICE: Status $RETRY_STATUS received (Render may still be booting)."
            exit 0
          fi

services:
  - type: web
    name: calle-backend-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker src.main:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: calle-healthcare-db
          property: connectionString
      - key: CALLE_API_KEY
        value: iams_live_oemQTmEoVgpE8l1MfOci_e1723eec26e016fb1c91e165ee7664c11f9f3f440f24f7a8c74f2ef91563418b
      - key: CALLE_BASE_URL
        value: https://api.heycall-e.com
      - key: JWT_SECRET
        value: secretjwtkeyforcallehealthcare2026
      - key: ENCRYPTION_KEY
        value: hYggyNW+JO9cGaCKHoMMRrQsvnYFIUIYg+P08iF1UKA=
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: calle-healthcare-db
    databaseName: bytelytic_clinic_db
    user: calle_user
    plan: free
    region: oregon
